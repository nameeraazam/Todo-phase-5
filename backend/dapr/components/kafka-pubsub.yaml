apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: default
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: "kafka:29092"
  - name: authType
    value: "none"
  - name: consumeRetryInterval
    value: "5s"
  - name: maxMessageBytes
    value: "1024"
  - name: autoCreateTopics
    value: "true"
